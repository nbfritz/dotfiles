# Enable mouse mode
set -g mouse on
unbind -T root M-MouseDown3Pane
unbind -T root MouseDown3Pane
unbind -T root MouseDown3Status

# Use leader-escape for copy mode
bind Escape copy-mode

# default main-format width and height
setw -g main-pane-height 66%
setw -g main-pane-width 66%

# Fix shift-enter for Claude
set -s escape-time 20
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# iTerm launches tmux directly, skipping zsh, so plugins can't find Homebrew's tmux
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Configure the tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Some sensible defaults for tmux
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard support
set -g @plugin 'tmux-plugins/tmux-yank'

# Prefix VIMKEYS to navigate and resize windows
set -g @pane_resize '2'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# MUST BE LAST IN THE FILE
run '~/.tmux/plugins/tpm/tpm'
